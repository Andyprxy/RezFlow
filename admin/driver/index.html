<!-- LEAFLET DEPENDENCIES -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
    /* ---------------------------------------------------
       ADOWA HYBRID NEUMORPHISM + GLASSMORPHISM
       --------------------------------------------------- */
    .glass-panel {
        background: rgba(255, 255, 255, 0.45); 
        backdrop-filter: blur(24px); 
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.8); 
        box-shadow: 8px 8px 24px rgba(166, 175, 195, 0.25), -8px -8px 24px rgba(255, 255, 255, 0.9); 
        border-radius: 28px;
    }

    .neo-inset {
        background: rgba(240, 242, 245, 0.5);
        box-shadow: inset 4px 4px 8px rgba(166, 175, 195, 0.25), inset -4px -4px 8px rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(255,255,255,0.4);
    }

    .neo-button {
        background: #f0f2f5;
        box-shadow: 5px 5px 12px rgba(166, 175, 195, 0.3), -5px -5px 12px rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.6);
        transition: all 0.2s ease;
    }
    .neo-button:active {
        box-shadow: inset 3px 3px 6px rgba(166, 175, 195, 0.3), inset -3px -3px 6px rgba(255, 255, 255, 0.9);
        transform: scale(0.98);
    }
    .neo-button.active-tab {
        background: #0f172a; color: white;
        box-shadow: inset 3px 3px 8px rgba(0,0,0,0.5);
        border: 1px solid #1e293b;
    }

    .neo-button-primary {
        background: #0f172a; color: white;
        box-shadow: 5px 5px 15px rgba(15, 23, 42, 0.3), -5px -5px 15px rgba(255, 255, 255, 0.8);
        border: 1px solid #1e293b;
    }
    .neo-button-primary:active { box-shadow: inset 3px 3px 8px rgba(0,0,0,0.5); transform: scale(0.98); }

    /* Map Marker */
    .driver-marker {
        background: #2563eb; border: 4px solid white; border-radius: 50%;
        box-shadow: 0 0 20px rgba(37, 99, 235, 0.6), inset 0 2px 4px rgba(0,0,0,0.3); 
        transition: all 0.5s ease-out;
    }
    
    .pulse-ring-map {
        position: absolute; width: 100%; height: 100%; top: 0; left: 0; border-radius: 50%;
        box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.6); animation: pulsate-map 1.5s infinite ease-out; z-index: -1;
    }
    @keyframes pulsate-map { 0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.6); } 100% { box-shadow: 0 0 0 25px rgba(37, 99, 235, 0); } }

    /* Scrollbars & Overrides */
    .custom-scroll::-webkit-scrollbar { width: 5px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.5); border-radius: 10px; }
    
    .leaflet-control-zoom a {
        background: #f0f2f5 !important; color: #475569 !important; border: 1px solid rgba(255,255,255,0.8) !important;
        box-shadow: 2px 2px 5px rgba(166, 175, 195, 0.3), -2px -2px 5px rgba(255, 255, 255, 0.9) !important;
        border-radius: 8px !important; margin-bottom: 5px !important;
    }
    
    @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
    .msg-card { animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
</style>

<!-- Main Component Wrapper -->
<div class="flex-1 flex flex-col lg:flex-row w-full h-full min-h-0 gap-4 lg:gap-6 relative p-2 lg:p-4 bg-[#f0f2f5] overflow-hidden rounded-[32px]">
    
    <!-- Background Ambience (Matching Driver Portal) -->
    <div class="absolute top-[-10%] left-[-10%] w-[60%] h-[60%] bg-blue-300 rounded-full mix-blend-multiply filter blur-[140px] opacity-[0.25] z-0 pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-emerald-200 rounded-full mix-blend-multiply filter blur-[120px] opacity-[0.2] z-0 pointer-events-none"></div>

    <!-- Map Section (Left) -->
    <div class="flex-1 relative rounded-[32px] overflow-hidden shadow-[10px_10px_30px_rgba(166,175,195,0.2),-10px_-10px_30px_rgba(255,255,255,0.9)] border border-white flex flex-col z-10 bg-[#f0f2f5]">
        
        <!-- Live GPS Indicator overlay -->
        <div class="absolute top-6 left-6 z-[400] bg-white/70 backdrop-blur-xl px-5 py-3 rounded-2xl flex items-center gap-3 shadow-[5px_5px_15px_rgba(166,175,195,0.2)] border border-white">
            <div id="admin-gps-indicator" class="w-3 h-3 bg-amber-400 rounded-full shadow-inner animate-pulse"></div>
            <span id="admin-gps-status" class="font-black text-slate-800 tracking-widest text-xs uppercase">Polling Telemetry...</span>
        </div>

        <div id="admin-fleet-map" class="w-full h-full z-10 absolute inset-0"></div>
    </div>

    <!-- Control Panel (Right) -->
    <div class="w-full lg:w-[420px] flex flex-col gap-4 lg:gap-5 z-20 flex-shrink-0 h-full">
        
        <!-- Header & View Switcher -->
        <div class="glass-panel p-6 lg:p-7 flex flex-col flex-shrink-0 relative overflow-hidden">
            <!-- Branding -->
            <div class="flex items-center justify-between mb-5 pb-4 border-b border-white">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-[14px] bg-[#1d1d1f] text-white flex items-center justify-center text-lg shadow-[5px_5px_15px_rgba(15,23,42,0.3),-5px_-5px_15px_rgba(255,255,255,0.8)] border border-slate-700">
                        <i class="fa-solid fa-satellite"></i>
                    </div>
                    <div class="flex flex-col">
                        <h1 class="text-lg font-black tracking-tight text-slate-900 leading-none">Admin Overwatch</h1>
                        <span class="text-[8px] text-slate-500 font-bold uppercase tracking-widest mt-1">Fleet Command</span>
                    </div>
                </div>
                <div class="neo-inset px-4 py-2 rounded-xl text-center min-w-[80px]">
                    <span id="system-clock-admin" class="text-sm font-black text-slate-800 font-mono tracking-wider">00:00</span>
                </div>
            </div>

            <!-- Tab Navigation -->
            <div class="grid grid-cols-3 gap-2">
                <button onclick="window.switchAdminTransView('feed')" id="tab-btn-feed" class="neo-button active-tab text-slate-600 font-black py-2.5 rounded-xl transition-all duration-300 flex items-center justify-center gap-2 text-[10px] uppercase tracking-widest">
                    <i class="fa-solid fa-rss"></i> Feed
                </button>
                <button onclick="window.switchAdminTransView('logs')" id="tab-btn-logs" class="neo-button text-slate-600 font-black py-2.5 rounded-xl transition-all duration-300 flex items-center justify-center gap-2 text-[10px] uppercase tracking-widest">
                    <i class="fa-solid fa-clock-rotate-left"></i> Logs
                </button>
                <button onclick="window.switchAdminTransView('dispatch')" id="tab-btn-dispatch" class="neo-button text-slate-600 font-black py-2.5 rounded-xl transition-all duration-300 flex items-center justify-center gap-2 text-[10px] uppercase tracking-widest">
                    <i class="fa-solid fa-walkie-talkie"></i> Dispatch
                </button>
            </div>
        </div>

        <!-- Dynamic Content Panel -->
        <div class="glass-panel p-6 lg:p-7 flex flex-col flex-1 min-h-0 relative">
            
            <!-- VIEW 1: Live Feed (Read-Only) -->
            <div id="admin-view-feed" class="flex flex-col h-full w-full">
                <div class="flex items-center justify-between mb-4 pb-3 border-b border-white flex-shrink-0">
                    <h3 class="font-black text-slate-800 text-sm uppercase tracking-widest flex items-center gap-2">
                        <i class="fa-solid fa-inbox text-blue-500"></i> Live Monitor
                    </h3>
                    <div class="flex items-center gap-3">
                        <button onclick="window.fetchAdminFeed(this)" class="w-7 h-7 rounded-full bg-white/60 hover:bg-white text-slate-600 shadow-sm flex items-center justify-center transition-colors border border-white/80" title="Refresh Inbox">
                            <i class="fa-solid fa-rotate text-[10px]"></i>
                        </button>
                        <div class="px-2.5 py-1 bg-slate-50 border border-slate-200 text-slate-600 rounded-lg text-[9px] uppercase tracking-widest font-bold shadow-sm flex items-center gap-1.5">
                            Read-Only
                        </div>
                    </div>
                </div>
                
                <div id="admin-message-feed" class="flex-1 overflow-y-auto custom-scroll space-y-4 pr-2 pb-2">
                    <div class="flex flex-col items-center justify-center h-full text-slate-400 opacity-60 space-y-3" id="admin-empty-state">
                        <i class="fa-solid fa-circle-notch fa-spin text-2xl"></i>
                        <span class="text-[10px] font-bold uppercase tracking-widest">Syncing Pipeline...</span>
                    </div>
                </div>
            </div>

            <!-- VIEW 2: Trip Logs -->
            <div id="admin-view-logs" class="hidden flex-col h-full w-full">
                <div class="flex items-center justify-between mb-4 pb-3 border-b border-white flex-shrink-0">
                    <h3 class="font-black text-slate-800 text-sm uppercase tracking-widest flex items-center gap-2">
                        <i class="fa-solid fa-clipboard-list text-emerald-500"></i> Event Logs
                    </h3>
                    <span class="px-2.5 py-1 bg-white border border-slate-200 text-slate-600 rounded-lg text-[9px] uppercase tracking-widest font-bold shadow-sm">Today</span>
                </div>
                
                <div id="admin-trip-logs" class="flex-1 overflow-y-auto custom-scroll space-y-3 pr-2 pb-2 relative">
                    <div class="absolute left-[23px] top-2 bottom-2 w-px bg-slate-300"></div>
                    <div class="text-center text-slate-400 font-bold text-xs py-10 tracking-wide uppercase" id="logs-empty-state">
                        Awaiting Telemetry Events...
                    </div>
                </div>
            </div>

            <!-- VIEW 3: Dispatch -->
            <div id="admin-view-dispatch" class="hidden flex-col h-full w-full">
                <div class="flex items-center justify-between mb-4 pb-3 border-b border-white flex-shrink-0">
                    <h3 class="font-black text-slate-800 text-sm uppercase tracking-widest flex items-center gap-2">
                        <i class="fa-solid fa-satellite-dish text-indigo-500"></i> Command Uplink
                    </h3>
                </div>
                
                <form class="space-y-4 flex-1 flex flex-col" onsubmit="window.sendDispatchFromAdmin(event)">
                    <div class="neo-inset p-3 rounded-2xl">
                        <label class="block text-[9px] font-black text-slate-600 uppercase tracking-widest mb-2 pl-1">Route Assignment</label>
                        <select id="admin-dispatch-route" class="w-full bg-white/70 border border-white rounded-xl py-2.5 px-3 text-xs font-bold text-slate-800 outline-none focus:border-indigo-400 shadow-sm">
                            <option value="Standard Campus Run">Standard Campus Run</option>
                            <option value="Mall Trip (Weekend)">Mall Trip (Weekend)</option>
                            <option value="Emergency Pickup">Emergency Pickup</option>
                            <option value="Custom Route">Custom Route</option>
                        </select>
                    </div>
                    
                    <div class="neo-inset p-3 rounded-2xl flex-1 flex flex-col">
                        <label class="block text-[9px] font-black text-slate-600 uppercase tracking-widest mb-2 pl-1">Direct Message</label>
                        <textarea id="admin-dispatch-msg" class="w-full bg-white/70 border border-white rounded-xl py-3 px-3 text-xs font-medium text-slate-700 outline-none focus:border-indigo-400 shadow-sm resize-none h-full min-h-[100px] flex-1" placeholder="Type instructions to driver console..." required></textarea>
                    </div>

                    <button type="submit" id="btn-admin-dispatch" class="neo-button-primary w-full font-black py-4 rounded-2xl transition-all duration-300 flex items-center justify-center gap-3 text-sm uppercase tracking-wider mt-2">
                        <i class="fa-solid fa-paper-plane text-lg"></i> Transmit
                    </button>
                </form>
            </div>

        </div>
    </div>
</div>

<!-- Hidden Toast Notification -->
<div id="toast-container" class="fixed top-6 left-1/2 transform -translate-x-1/2 z-[5000] flex justify-center px-4 pointer-events-none transition-transform duration-300 -translate-y-[150%]">
    <div id="toast-message" class="bg-slate-900 border border-slate-700 text-white px-6 py-3.5 rounded-2xl shadow-2xl flex items-center gap-3 font-medium text-sm whitespace-nowrap">
        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toast-text">Action completed.</span>
    </div>
</div>

<script>
    // --- UI Toast ---
    window.showToast = function(message, type = 'success') { 
        const tc = document.getElementById('toast-container'); 
        document.getElementById('toast-text').textContent = message; 
        document.getElementById('toast-icon').className = type === 'success' ? 'fa-solid fa-circle-check text-emerald-400' : 'fa-solid fa-triangle-exclamation text-rose-400'; 
        tc.classList.add('translate-y-0'); tc.classList.remove('-translate-y-[150%]');
        setTimeout(() => { tc.classList.remove('translate-y-0'); tc.classList.add('-translate-y-[150%]'); }, 3000); 
    };

    // --- Clock ---
    setInterval(() => {
        const now = new Date();
        const el = document.getElementById('system-clock-admin');
        if(el) el.innerText = now.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' });
    }, 1000);

    // --- Tab Switcher ---
    window.switchAdminTransView = function(view) {
        ['feed', 'logs', 'dispatch'].forEach(v => {
            const btn = document.getElementById(`tab-btn-${v}`);
            const panel = document.getElementById(`admin-view-${v}`);
            if(btn) {
                btn.classList.remove('active-tab', 'text-white');
                btn.classList.add('text-slate-600');
            }
            if(panel) {
                panel.classList.add('hidden');
                panel.classList.remove('flex');
            }
        });
        
        const activeBtn = document.getElementById(`tab-btn-${view}`);
        const activePanel = document.getElementById(`admin-view-${view}`);
        
        if(activeBtn) {
            activeBtn.classList.add('active-tab', 'text-white');
            activeBtn.classList.remove('text-slate-600');
        }
        if(activePanel) {
            activePanel.classList.remove('hidden');
            activePanel.classList.add('flex');
        }
    };

    // --- Map & Telemetry ---
    window.adminMap = null;
    window.adminShuttleMarker = null;
    window.telemetryPoller = null;
    window.feedPoller = null;
    window.lastStatus = null;

    window.initAdminMap = function() {
        const mapEl = document.getElementById('admin-fleet-map');
        if(!mapEl || window.adminMap) return;

        window.adminMap = L.map('admin-fleet-map', { zoomControl: false }).setView([-25.7479, 28.2293], 15);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(window.adminMap);
        
        L.control.zoom({ position: 'bottomleft' }).addTo(window.adminMap);
        
        const shuttleIcon = L.divIcon({ 
            className: '', 
            html: '<div class="driver-marker w-5 h-5 flex items-center justify-center relative"><div class="pulse-ring-map"></div></div>',
            iconSize: [20, 20], iconAnchor: [10, 10] 
        });
        
        window.adminShuttleMarker = L.marker([-25.7479, 28.2293], {icon: shuttleIcon}).addTo(window.adminMap);
        
        // Critical Fix: Force map to recalculate layout size after container renders
        setTimeout(() => { window.adminMap.invalidateSize(); }, 500);

        window.fetchFleetLocation();
        if(window.telemetryPoller) clearInterval(window.telemetryPoller);
        window.telemetryPoller = setInterval(window.fetchFleetLocation, 10000);
    };

    window.fetchFleetLocation = async function() {
        const indicator = document.getElementById('admin-gps-indicator');
        const statusText = document.getElementById('admin-gps-status');

        try {
            let lat = -25.7479; let lng = 28.2293; let status = "Standing By";
            
            try {
                const res = await fetch('https://n8n.automania.cloud/webhook/reziflow-get-gps');
                if(res.ok) {
                    const data = await res.json();
                    const payload = Array.isArray(data) ? (data[0].json || data[0]) : (data.json || data);
                    if(payload && payload.Latitude && payload.Longitude) {
                        lat = parseFloat(payload.Latitude); lng = parseFloat(payload.Longitude);
                        status = payload.Status || status;
                    }
                }
            } catch (e) {
                // Simulation Fallback if endpoint not active
                lat += (Math.random() - 0.5) * 0.005; lng += (Math.random() - 0.5) * 0.005;
                status = Math.random() > 0.5 ? "En Route" : "Standing By";
            }

            if(window.adminShuttleMarker && window.adminMap) {
                window.adminShuttleMarker.setLatLng([lat, lng]);
                window.adminMap.panTo([lat, lng]);
            }

            if(indicator) {
                indicator.className = "w-3 h-3 rounded-full shadow-inner bg-emerald-500 animate-pulse";
                statusText.innerText = `Active: ${status}`;
                statusText.className = "font-black text-emerald-600 tracking-widest text-xs uppercase";
            }

            // Log event if status changes
            if(window.lastStatus !== status) {
                window.logTripEvent(status, lat, lng);
                window.lastStatus = status;
            }

        } catch(e) {
            if(indicator) {
                indicator.className = "w-3 h-3 rounded-full shadow-inner bg-rose-500";
                statusText.innerText = "Signal Lost";
                statusText.className = "font-black text-rose-600 tracking-widest text-xs uppercase";
            }
        }
    };

    // --- Read-Only Feed (Matches Driver Sync) ---
    window.fetchAdminFeed = async function(btn) {
        if(btn) { const i = btn.querySelector('i'); if(i) i.classList.add('fa-spin', 'text-blue-500'); }
        const feed = document.getElementById('admin-message-feed');

        try {
            const timeBuster = Date.now();
            const response = await fetch('https://n8n.automania.cloud/webhook/reziflow-get-driver-msgs?t=' + timeBuster, { cache: 'no-store' });
            
            if (!response.ok) throw new Error("Fetch failed");
            const rawText = await response.text();
            if (!rawText || rawText.trim() === "") throw new Error("Empty");
            
            let rawData = JSON.parse(rawText);
            let requests = Array.isArray(rawData) ? rawData.map(item => item.json ? item.json : item) : 
                           (rawData.data && Array.isArray(rawData.data) ? rawData.data.map(item => item.json ? item.json : item) : 
                           (rawData.json ? [rawData.json] : [rawData]));

            const validRequests = requests.filter(req => req && req.Message_ID && String(req.Message_ID).includes('REQ'));

            if (validRequests.length === 0) {
                feed.innerHTML = `<div class="text-center text-slate-400 font-bold text-xs py-10 tracking-wide uppercase">No active dispatch requests.</div>`;
            } else {
                let html = '';
                validRequests.forEach(req => {
                    const reqStatus = String(req.Status || 'Pending').trim();
                    let iconHtml = '<i class="fa-solid fa-message text-blue-500"></i>';
                    if (String(req.Type).includes('Stop')) iconHtml = '<i class="fa-solid fa-map-pin text-rose-500"></i>';
                    if (String(req.Type).includes('Delay')) iconHtml = '<i class="fa-solid fa-hourglass-half text-amber-500"></i>';

                    let badgeHtml = '';
                    if(reqStatus === 'Pending') badgeHtml = `<span class="bg-amber-100 text-amber-700 px-2 py-0.5 rounded text-[8px] font-black uppercase tracking-widest"><i class="fa-solid fa-clock mr-1"></i>Pending</span>`;
                    else if(reqStatus === 'Approved') badgeHtml = `<span class="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded text-[8px] font-black uppercase tracking-widest"><i class="fa-solid fa-check mr-1"></i>Approved</span>`;
                    else if(reqStatus === 'Rejected') badgeHtml = `<span class="bg-rose-100 text-rose-700 px-2 py-0.5 rounded text-[8px] font-black uppercase tracking-widest"><i class="fa-solid fa-xmark mr-1"></i>Rejected</span>`;

                    html += `
                        <div class="msg-card neo-inset rounded-[24px] p-5 flex flex-col gap-4 shadow-sm bg-white/40">
                            <div class="flex justify-between items-start">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-xl bg-white flex items-center justify-center text-sm shadow-sm border border-white">
                                        ${iconHtml}
                                    </div>
                                    <div>
                                        <p class="font-black text-slate-800 text-sm leading-tight">${req.Type || 'Dispatch Note'}</p>
                                        <p class="text-[9px] text-slate-500 uppercase tracking-widest font-bold mt-1">From: <span class="text-slate-700">${req.Student_Name || 'Resident'}</span></p>
                                    </div>
                                </div>
                                <div class="flex flex-col items-end gap-1.5">
                                    <span class="text-[10px] font-mono text-slate-600 font-bold bg-white border border-white px-2.5 py-1 rounded-lg shadow-sm">${req.Time || '--:--'}</span>
                                    ${badgeHtml}
                                </div>
                            </div>
                            <div class="bg-white/80 border border-white rounded-xl p-4 shadow-sm relative overflow-hidden">
                                <div class="absolute left-0 top-0 bottom-0 w-1 bg-blue-400"></div>
                                <p class="text-slate-700 text-xs font-semibold italic">"${req.Message || ''}"</p>
                            </div>
                        </div>
                    `;
                });
                feed.innerHTML = html;
            }
        } catch (e) {
            feed.innerHTML = `<div class="text-center text-rose-400 font-bold text-xs py-10 tracking-wide uppercase">Feed offline.</div>`;
        } finally {
            if(btn) { const i = btn.querySelector('i'); if(i) i.classList.remove('fa-spin', 'text-blue-500'); }
        }
    };

    // --- Trip Logs ---
    window.logTripEvent = function(status, lat, lng) {
        const container = document.getElementById('admin-trip-logs');
        const emptyState = document.getElementById('logs-empty-state');
        if(emptyState) emptyState.remove();

        const timeStr = new Date().toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit', hour12: false});
        
        let icon = status.toLowerCase().includes('route') ? '<i class="fa-solid fa-route"></i>' : '<i class="fa-solid fa-power-off"></i>';
        let color = status.toLowerCase().includes('route') ? 'bg-blue-500' : 'bg-slate-400';

        const html = `
            <div class="relative flex items-start gap-4 mb-2 group z-10">
                <div class="w-8 h-8 rounded-full ${color} text-white border-2 border-white shadow-md flex items-center justify-center text-[10px] shrink-0 z-10">
                    ${icon}
                </div>
                <div class="neo-inset p-3 rounded-2xl flex-1 group-hover:bg-white/60 transition-colors">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-[10px] font-black text-slate-800 uppercase tracking-widest">${status}</span>
                        <span class="text-[9px] font-mono font-bold text-slate-500 bg-white px-1.5 py-0.5 rounded shadow-sm">${timeStr}</span>
                    </div>
                    <p class="text-[8px] text-slate-500 font-mono mt-1">COORD: ${lat.toFixed(5)}, ${lng.toFixed(5)}</p>
                </div>
            </div>
        `;
        container.insertAdjacentHTML('afterbegin', html);
    };

    // --- Dispatch to Driver ---
    window.sendDispatchFromAdmin = async function(e) {
        e.preventDefault();
        const btn = document.getElementById('btn-admin-dispatch'); const ogText = btn.innerHTML;
        const route = document.getElementById('admin-dispatch-route').value;
        const msg = document.getElementById('admin-dispatch-msg').value;

        const payload = { Target: "Shuttle_01_Console", Route: route, Message: msg, Priority: 'Admin Override' };

        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Transmitting...'; btn.disabled = true;
        try {
            await fetch('https://n8n.automania.cloud/webhook/reziflow-send-communication', { 
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) 
            });
            e.target.reset();
            window.showToast("Command transmitted to driver console.");
        } catch(error) { 
            window.showToast("Transmission failed.", "error"); 
        } finally { 
            btn.innerHTML = ogText; btn.disabled = false; 
        }
    };

    // --- Init ---
    setTimeout(() => { 
        window.initAdminMap(); 
        window.fetchAdminFeed();
        if(window.feedPoller) clearInterval(window.feedPoller);
        window.feedPoller = setInterval(() => { window.fetchAdminFeed(); }, 15000);
    }, 300);

</script>
