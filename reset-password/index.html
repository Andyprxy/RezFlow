<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#eef3ef">
  <title>Reset your password | RezFlow</title>
  <link rel="stylesheet" href="/assets/css/portal.css">
  <link rel="icon" href="/home-assets/rezflow-icon.png">
  <script defer src="/assets/canonical.js"></script>
  <script type="module" src="/assets/js/account.js"></script>
</head>
<body class="workspace auth-view" data-account-page="reset-password">
  <main class="auth-layout">
    <section class="auth-card" aria-labelledby="account-title">
      <a class="wordmark" href="/" aria-label="RezFlow home"><img src="/home-assets/rezflow.webp" alt="RezFlow" width="390" height="137"></a>
      <header>
        <p class="eyebrow" id="residence-name">Residence account</p>
        <h1 id="account-title">Reset your password</h1>
        <p id="account-instruction">Enter your account email to request a password reset.</p>
      </header>
      <p class="notice" id="account-status" role="status" aria-live="polite" tabindex="-1" hidden></p>
      <noscript>Enable JavaScript to use account services.</noscript>
      <form id="recovery-form" method="post">
        <fieldset class="stack" disabled>
          <label class="field">Email address<input type="email" name="email" autocomplete="email" inputmode="email" required maxlength="254"></label>
          <button class="button primary" type="submit">Request reset link</button>
        </fieldset>
      </form>
      <form id="password-form" method="post" hidden>
        <fieldset class="stack" disabled>
          <label class="field">New password<input type="password" name="password" autocomplete="new-password" required minlength="8" aria-describedby="password-help"></label>
          <p class="form-hint" id="password-help">Use at least 8 characters.</p>
          <label class="field">Confirm new password<input type="password" name="confirmation" autocomplete="new-password" required minlength="8"></label>
          <button class="button primary" type="submit">Save new password</button>
        </fieldset>
      </form>
      <div class="actions"><button id="retry-link" class="button primary" type="button" hidden>Retry email link</button></div>
      <p id="continue-area" class="actions" hidden><a class="button primary" id="account-continue" href="/students/">Continue to workspace</a></p>
      <nav aria-label="Account options" class="stack">
        <a data-account-link href="/signin/">Return to sign in</a>
        <a id="account-demo" href="/phumelela/demo/" hidden>Explore the sample workspace</a>
      </nav>
    </section>
  </main>
</body>
</html>
