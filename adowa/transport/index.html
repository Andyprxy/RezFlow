<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Adowa | Driver Command</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f0f2f5; overflow: hidden; color: #1d1d1f; -webkit-font-smoothing: antialiased; }
        
        /* Glassmorphism + Neumorphism Hybrid */
        .glass-panel {
            background: rgba(255, 255, 255, 0.45); 
            backdrop-filter: blur(24px); 
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.8); 
            box-shadow: 8px 8px 24px rgba(166, 175, 195, 0.25), -8px -8px 24px rgba(255, 255, 255, 0.9); 
            border-radius: 28px;
        }

        .neo-inset {
            background: rgba(240, 242, 245, 0.5);
            box-shadow: inset 4px 4px 8px rgba(166, 175, 195, 0.25), inset -4px -4px 8px rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255,255,255,0.4);
        }

        .neo-button {
            background: #f0f2f5;
            box-shadow: 5px 5px 12px rgba(166, 175, 195, 0.3), -5px -5px 12px rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.2s ease;
        }
        .neo-button:active {
            box-shadow: inset 3px 3px 6px rgba(166, 175, 195, 0.3), inset -3px -3px 6px rgba(255, 255, 255, 0.9);
            transform: scale(0.98);
        }

        .neo-button-primary {
            background: #0f172a;
            color: white;
            box-shadow: 5px 5px 15px rgba(15, 23, 42, 0.3), -5px -5px 15px rgba(255, 255, 255, 0.8);
            border: 1px solid #1e293b;
        }
        .neo-button-primary:active {
            box-shadow: inset 3px 3px 8px rgba(0,0,0,0.5);
            transform: scale(0.98);
        }

        .neo-button-danger {
            background: #e11d48;
            color: white;
            box-shadow: 5px 5px 15px rgba(225, 29, 72, 0.25), -5px -5px 15px rgba(255, 255, 255, 0.8);
            border: 1px solid #be123c;
        }
        .neo-button-danger:active {
            box-shadow: inset 3px 3px 8px rgba(0,0,0,0.3);
            transform: scale(0.98);
        }

        .pulse-ring { animation: pulsate 1.5s infinite ease-out; }
        @keyframes pulsate {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            100% { box-shadow: 0 0 0 20px rgba(16, 185, 129, 0); }
        }
        
        /* Premium Blue Map Marker */
        .driver-marker {
            background: #2563eb; border: 4px solid white; border-radius: 50%;
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.6), inset 0 2px 4px rgba(0,0,0,0.3); 
            transition: all 0.5s ease-out;
        }

        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.5); border-radius: 10px; }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .msg-card { animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        /* Leaflet Controls Override for Neumorphism */
        .leaflet-control-zoom a {
            background: #f0f2f5 !important;
            color: #475569 !important;
            border: 1px solid rgba(255,255,255,0.8) !important;
            box-shadow: 2px 2px 5px rgba(166, 175, 195, 0.3), -2px -2px 5px rgba(255, 255, 255, 0.9) !important;
            border-radius: 8px !important;
            margin-bottom: 5px !important;
        }
    </style>
</head>
<body class="p-3 lg:p-6 flex flex-col lg:flex-row h-screen max-h-screen gap-4 lg:gap-6 relative">

    <!-- Background Ambience -->
    <div class="fixed top-[-10%] left-[-10%] w-[60%] h-[60%] bg-blue-300 rounded-full mix-blend-multiply filter blur-[140px] opacity-[0.25] z-0 pointer-events-none"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-emerald-200 rounded-full mix-blend-multiply filter blur-[120px] opacity-[0.2] z-0 pointer-events-none"></div>

    <!-- Map Section (Left) -->
    <div class="flex-1 relative rounded-[32px] overflow-hidden shadow-[10px_10px_30px_rgba(166,175,195,0.2),-10px_-10px_30px_rgba(255,255,255,0.9)] border border-white flex flex-col z-10 bg-[#f0f2f5]">
        
        <!-- Live GPS Indicator overlay -->
        <div class="absolute top-6 left-6 z-[400] bg-white/70 backdrop-blur-xl px-5 py-3 rounded-2xl flex items-center gap-3 shadow-[5px_5px_15px_rgba(166,175,195,0.2)] border border-white">
            <div id="gps-indicator" class="w-3 h-3 bg-slate-300 rounded-full shadow-inner"></div>
            <span id="gps-status" class="font-black text-slate-800 tracking-widest text-xs uppercase">GPS Offline</span>
        </div>

        <div id="driver-map" class="w-full h-full z-10"></div>
    </div>

    <!-- Control Panel (Right) -->
    <div class="w-full lg:w-[420px] flex flex-col gap-4 lg:gap-5 z-20 flex-shrink-0 h-full">
        
        <!-- Header & Trip Controls -->
        <div class="glass-panel p-6 lg:p-7 flex flex-col flex-shrink-0 relative overflow-hidden">
            
            <!-- Branding -->
            <div class="flex items-center justify-between mb-6 pb-4 border-b border-white">
                <div class="flex items-center gap-3">
                    <img src="/adowa.png" alt="Adowa Logo" class="h-8 w-auto object-contain drop-shadow-sm">
                    <div class="flex flex-col">
                        <h1 class="text-lg font-black tracking-tight text-slate-900 leading-none">Adowa Transport</h1>
                        <span class="text-[8px] text-slate-500 font-bold uppercase tracking-widest mt-1">Driver Command</span>
                    </div>
                </div>
                <div class="neo-inset px-4 py-2 rounded-xl text-center min-w-[80px]">
                    <span id="system-clock" class="text-sm font-black text-slate-800 font-mono tracking-wider">00:00</span>
                </div>
            </div>

            <!-- Vehicle Status -->
            <div class="flex justify-between items-end mb-6">
                <div>
                    <h2 class="text-2xl font-black tracking-tight text-slate-800">Shuttle 01</h2>
                    <p id="trip-status-text" class="text-xs text-slate-500 font-bold uppercase tracking-widest mt-1 flex items-center gap-1.5">
                        <i class="fa-solid fa-power-off"></i> Standing By
                    </p>
                </div>
            </div>

            <!-- Core Actions -->
            <div class="flex flex-col gap-3">
                <!-- Trip Management -->
                <div class="grid grid-cols-1 gap-3">
                    <button id="btn-start-trip" onclick="toggleTrip('start')" class="neo-button-primary w-full font-black py-4 rounded-2xl transition-all duration-300 flex items-center justify-center gap-3 text-sm uppercase tracking-wider">
                        <i class="fa-solid fa-route text-lg"></i> Start Route
                    </button>
                    <button id="btn-end-trip" onclick="toggleTrip('end')" class="hidden neo-button-danger w-full font-black py-4 rounded-2xl transition-all duration-300 flex items-center justify-center gap-3 text-sm uppercase tracking-wider">
                        <i class="fa-solid fa-flag-checkered text-lg"></i> End Route
                    </button>
                </div>

                <!-- Manual Broadcast Override -->
                <button id="btn-broadcast" onclick="toggleBroadcast()" class="neo-button w-full text-slate-600 font-black py-3.5 rounded-2xl transition-all duration-300 flex items-center justify-center gap-3 text-xs uppercase tracking-widest mt-2">
                    <i class="fa-solid fa-satellite-dish"></i> <span id="btn-text">Manual Broadcast</span>
                </button>
            </div>
        </div>

        <!-- Dispatch Inbox -->
        <div class="glass-panel p-6 lg:p-7 flex flex-col flex-1 min-h-0">
            <div class="flex items-center justify-between mb-4 pb-3 border-b border-white flex-shrink-0">
                <h3 class="font-black text-slate-800 text-sm uppercase tracking-widest flex items-center gap-2">
                    <i class="fa-solid fa-inbox text-blue-500"></i> Dispatch Queue
                </h3>
                
                <!-- Manual Refresh Implementation -->
                <div class="flex items-center gap-3">
                    <button onclick="manualRefreshRequests(this)" class="w-7 h-7 rounded-full bg-white/60 hover:bg-white text-slate-600 shadow-sm flex items-center justify-center transition-colors border border-white/80" title="Refresh Inbox">
                        <i class="fa-solid fa-rotate text-[10px]"></i>
                    </button>
                    <div class="px-2.5 py-1 bg-slate-50 border border-slate-200 text-slate-600 rounded-lg text-[9px] uppercase tracking-widest font-bold shadow-sm flex items-center gap-1.5">
                        Manual Sync
                    </div>
                </div>
            </div>
            
            <div id="message-feed" class="flex-1 overflow-y-auto custom-scroll space-y-4 pr-2 pb-2">
                <div class="text-center text-slate-400 font-bold text-xs py-10 tracking-wide uppercase" id="empty-state">
                    No active dispatch requests.
                </div>
            </div>
        </div>
        
    </div>

    <!-- Hidden Toast Notification -->
    <div id="toast-container" class="fixed top-6 left-1/2 transform -translate-x-1/2 z-[5000] flex justify-center px-4 pointer-events-none transition-transform duration-300 -translate-y-[150%]">
        <div id="toast-message" class="bg-slate-900 border border-slate-700 text-white px-6 py-3.5 rounded-2xl shadow-2xl flex items-center gap-3 font-medium text-sm whitespace-nowrap">
            <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
            <span id="toast-text">Action completed successfully.</span>
        </div>
    </div>

    <script>
        // --- UI Toast Notification ---
        function showToast(message, type = 'success') { 
            const tc = document.getElementById('toast-container'); 
            document.getElementById('toast-text').textContent = message; 
            document.getElementById('toast-icon').className = type === 'success' ? 'fa-solid fa-circle-check text-emerald-400' : 'fa-solid fa-triangle-exclamation text-rose-400'; 
            tc.classList.add('translate-y-0'); tc.classList.remove('-translate-y-[150%]');
            setTimeout(() => { tc.classList.remove('translate-y-0'); tc.classList.add('-translate-y-[150%]'); }, 3000); 
        }

        // --- System Clock ---
        setInterval(() => {
            const now = new Date();
            document.getElementById('system-clock').innerText = now.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' });
        }, 1000);

        // --- Map Initialization ---
        const map = L.map('driver-map', { zoomControl: false }).setView([-25.7479, 28.2293], 15);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            maxZoom: 19
        }).addTo(map);
        
        // Custom Neumorphic Zoom Controls position
        L.control.zoom({ position: 'bottomleft' }).addTo(map);
        
        const driverIcon = L.divIcon({ className: 'driver-marker', iconSize: [20, 20], iconAnchor: [10, 10] });
        let marker = null;

        // --- Trip & Telemetry Broadcasting ---
        let watchId;
        let isBroadcasting = false;
        let isTripActive = false;

        function toggleTrip(state) {
            isTripActive = (state === 'start');
            const startBtn = document.getElementById('btn-start-trip');
            const endBtn = document.getElementById('btn-end-trip');
            const statusText = document.getElementById('trip-status-text');

            if (isTripActive) {
                startBtn.classList.add('hidden');
                endBtn.classList.remove('hidden');
                statusText.innerHTML = '<i class="fa-solid fa-route"></i> Route in Progress';
                statusText.classList.replace('text-slate-500', 'text-blue-600');
                showToast("Route officially started. Tracking engaged.");
                
                // Auto-start GPS if not running
                if (!isBroadcasting) toggleBroadcast();
            } else {
                endBtn.classList.add('hidden');
                startBtn.classList.remove('hidden');
                statusText.innerHTML = '<i class="fa-solid fa-power-off"></i> Standing By';
                statusText.classList.replace('text-blue-600', 'text-slate-500');
                showToast("Route concluded. Tracking disengaged.");
                
                // Auto-stop GPS if running
                if (isBroadcasting) toggleBroadcast();
            }
        }

        function toggleBroadcast() {
            const btn = document.getElementById('btn-broadcast');
            const btnText = document.getElementById('btn-text');
            const gpsIndicator = document.getElementById('gps-indicator');
            const gpsStatus = document.getElementById('gps-status');

            if (!isBroadcasting) {
                if ("geolocation" in navigator) {
                    // Update Button UI to Active
                    btn.classList.remove('text-slate-600');
                    btn.classList.add('text-emerald-600', 'pulse-ring');
                    btn.style.borderColor = '#10b981';
                    btnText.innerText = 'Transmission Active';
                    
                    // Update GPS Widget UI
                    gpsIndicator.classList.replace('bg-slate-300', 'bg-emerald-500');
                    gpsIndicator.classList.add('animate-pulse');
                    gpsStatus.innerText = 'Tracking Active';
                    gpsStatus.classList.replace('text-slate-800', 'text-emerald-600');

                    isBroadcasting = true;

                    watchId = navigator.geolocation.watchPosition(
                        sendLocationToN8n, 
                        (err) => showToast("GPS Error: Check location permissions.", "error"),
                        { enableHighAccuracy: true, maximumAge: 0 }
                    );
                }
            } else {
                navigator.geolocation.clearWatch(watchId);
                
                // Revert Button UI
                btn.classList.add('text-slate-600');
                btn.classList.remove('text-emerald-600', 'pulse-ring');
                btn.style.borderColor = 'rgba(255, 255, 255, 0.6)';
                btnText.innerText = 'Manual Broadcast';
                
                // Revert GPS Widget UI
                gpsIndicator.classList.replace('bg-emerald-500', 'bg-slate-300');
                gpsIndicator.classList.remove('animate-pulse');
                gpsStatus.innerText = 'GPS Offline';
                gpsStatus.classList.replace('text-emerald-600', 'text-slate-800');

                isBroadcasting = false;
            }
        }

        async function sendLocationToN8n(position) {
            const newLatLng = [position.coords.latitude, position.coords.longitude];

            if (!marker) {
                marker = L.marker(newLatLng, { icon: driverIcon }).addTo(map);
            } else {
                marker.setLatLng(newLatLng);
            }
            map.setView(newLatLng, 17); 

            // Preserved Webhook Logic
            fetch('https://n8n.automania.cloud/webhook/reziflow-driver-gps', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    Driver_ID: "SHUTTLE-01",
                    Latitude: position.coords.latitude,
                    Longitude: position.coords.longitude,
                    Timestamp: new Date().toISOString(),
                    Status: isTripActive ? "En Route" : "Standing By"
                })
            }).catch(e => console.log("Cloud sync failed."));
        }

        // --- Inbox Engine: Manual Sync System ---
        let renderedMessageIds = new Set();

        async function manualRefreshRequests(btn) {
            // UI Feedback during refresh
            if(btn) {
                const icon = btn.querySelector('i');
                if(icon) icon.classList.add('fa-spin', 'text-blue-500');
            }

            await fetchStudentRequests();
            
            showToast("Dispatch queue synced.");

            // Reset UI Feedback
            if(btn) {
                const icon = btn.querySelector('i');
                if(icon) icon.classList.remove('fa-spin', 'text-blue-500');
            }
        }

        async function fetchStudentRequests() {
            try {
                const timeBuster = Date.now();
                const response = await fetch('https://n8n.automania.cloud/webhook/reziflow-get-driver-msgs?t=' + timeBuster, { cache: 'no-store' });
                
                if (!response.ok) return; 
                
                const rawText = await response.text();
                if (!rawText || rawText.trim() === "") return;
                
                let rawData = JSON.parse(rawText);
                let requests = [];
                
                if (Array.isArray(rawData)) {
                    requests = rawData.map(item => item.json ? item.json : item);
                } else if (rawData && rawData.data && Array.isArray(rawData.data)) {
                    requests = rawData.data.map(item => item.json ? item.json : item);
                } else {
                    requests = rawData.json ? [rawData.json] : [rawData];
                }

                const feed = document.getElementById('message-feed');
                const emptyState = document.getElementById('empty-state');

                const validRequests = requests.filter(req => req && req.Message_ID && String(req.Message_ID).includes('REQ'));

                if (validRequests.length > 0 && emptyState) {
                    emptyState.remove();
                }
                
                validRequests.forEach(req => {
                    // Feed only renders Pending items
                    if (!renderedMessageIds.has(req.Message_ID) && String(req.Status).trim() === 'Pending') {
                        
                        let iconHtml = '<i class="fa-solid fa-message text-blue-500"></i>';
                        if (String(req.Type).includes('Stop')) iconHtml = '<i class="fa-solid fa-map-pin text-rose-500"></i>';
                        if (String(req.Type).includes('Delay')) iconHtml = '<i class="fa-solid fa-hourglass-half text-amber-500"></i>';

                        const cardHtml = `
                            <div class="msg-card neo-inset rounded-[24px] p-5 flex flex-col gap-4 shadow-sm bg-white/40" id="msg-${req.Message_ID}">
                                <div class="flex justify-between items-start">
                                    <div class="flex items-center gap-3">
                                        <div class="w-10 h-10 rounded-xl bg-white flex items-center justify-center text-sm shadow-sm border border-white">
                                            ${iconHtml}
                                        </div>
                                        <div>
                                            <p class="font-black text-slate-800 text-sm leading-tight">${req.Type || 'Dispatch Note'}</p>
                                            <p class="text-[9px] text-slate-500 uppercase tracking-widest font-bold mt-1">From: <span class="text-slate-700">${req.Student_Name || 'Resident'}</span></p>
                                        </div>
                                    </div>
                                    <span class="text-[10px] font-mono text-slate-600 font-bold bg-white border border-white px-2.5 py-1 rounded-lg shadow-sm">${req.Time || '--:--'}</span>
                                </div>
                                
                                <div class="bg-white/80 border border-white rounded-xl p-4 shadow-sm relative overflow-hidden">
                                    <div class="absolute left-0 top-0 bottom-0 w-1 bg-blue-400"></div>
                                    <p class="text-slate-700 text-xs font-semibold italic">"${req.Message || ''}"</p>
                                </div>

                                <div class="grid grid-cols-2 gap-3 mt-1 action-buttons-container">
                                    <button onclick="resolveMessage(this, '${req.Message_ID}', 'Rejected')" class="neo-button w-full py-3 text-rose-600 hover:text-rose-700 rounded-xl text-xs font-black uppercase tracking-widest transition-all flex items-center justify-center gap-2">
                                        <i class="fa-solid fa-xmark"></i> Reject
                                    </button>
                                    <button onclick="resolveMessage(this, '${req.Message_ID}', 'Approved')" class="neo-button w-full py-3 text-emerald-600 hover:text-emerald-700 rounded-xl text-xs font-black uppercase tracking-widest transition-all flex items-center justify-center gap-2">
                                        <i class="fa-solid fa-check"></i> Approve
                                    </button>
                                </div>
                            </div>
                        `;
                        
                        feed.insertAdjacentHTML('afterbegin', cardHtml);
                        renderedMessageIds.add(req.Message_ID);
                    }
                });
            } catch (e) {
                console.log("Awaiting manual dispatch sync...");
            }
        }

        async function resolveMessage(btnElement, messageId, newStatus) {
            const card = btnElement.closest('.msg-card');
            const buttonsContainer = btnElement.closest('.action-buttons-container');
            
            // Render seamless loading state based on action taken
            const loaderColor = newStatus === 'Approved' ? 'emerald' : 'rose';
            buttonsContainer.innerHTML = `
                <div class="col-span-2 w-full py-3.5 bg-white/50 rounded-xl border border-white flex items-center justify-center gap-2 text-slate-500 text-[10px] uppercase tracking-widest font-bold shadow-inner">
                    <i class="fa-solid fa-circle-notch fa-spin text-${loaderColor}-500 text-sm"></i> 
                    ${newStatus === 'Approved' ? 'Approving Dispatch...' : 'Rejecting Dispatch...'}
                </div>
            `;

            try {
                // Preserved Webhook Logic
                await fetch('https://n8n.automania.cloud/webhook/reziflow-resolve-msg', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ID: messageId, Status: newStatus })
                });
            } catch(e) {
                console.log("Failed to sync resolution to cloud.");
            }

            // Execute shrinking animation
            card.style.transition = "all 0.4s cubic-bezier(0.16, 1, 0.3, 1)";
            card.style.opacity = "0";
            card.style.transform = "translateY(-10px) scale(0.95)";
            
            setTimeout(() => {
                card.remove();
                renderedMessageIds.delete(messageId); 
                
                // Return empty state if feed is cleared
                const feed = document.getElementById('message-feed');
                if (feed.children.length === 0) {
                    feed.innerHTML = `<div class="text-center text-slate-400 font-bold text-xs py-10 tracking-wide uppercase" id="empty-state">No active dispatch requests.</div>`;
                }
            }, 400);
        }

        // Fetch requests once on initial load
        fetchStudentRequests();
    </script>
</body>
</html>
